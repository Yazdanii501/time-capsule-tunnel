<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Capsule Tunnel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050507;
      --text: #f0ebe3;
      --muted: #9a948a;
      --gold: #c9a66b;
      --gold-soft: rgba(201, 166, 107, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .progress {
      position: fixed; top: 0; left: 0; right: 0; height: 1.5px; z-index: 100;
      background: rgba(255,255,255,0.04);
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #c9a66b, #e8d5a3);
      box-shadow: 0 0 10px rgba(201,166,107,0.5);
      transition: width 0.1s linear;
    }
    .era-nav {
      position: fixed;
      left: 28px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 90;
      display: none;
      flex-direction: column;
      gap: 22px;
    }
    @media (min-width: 900px) { .era-nav { display: flex; } }
    .era-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: none;
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.16,1,0.3,1);
      position: relative;
    }
    .era-dot.active {
      background: var(--gold);
      transform: scale(1.6);
      box-shadow: 0 0 12px var(--gold-soft);
    }
    .era-dot.unlocked:not(.active) { background: rgba(201,166,107,0.55); }
    .era-dot span {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .era-dot:hover span,
    .era-dot.active span { opacity: 1; color: var(--gold); }
    .entrance {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      padding: 2rem;
      overflow: hidden;
    }
    .entrance-glow {
      position: absolute;
      top: 45%;
      left: 50%;
      width: min(110vw, 900px);
      height: min(110vw, 900px);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at 45% 40%, rgba(201,166,107,0.14) 0%, transparent 50%),
        radial-gradient(circle at 55% 60%, rgba(140,100,60,0.08) 0%, transparent 55%);
      animation: entrance-breathe 10s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes entrance-breathe {
      0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
    }
    .entrance-label {
      font-size: 0.7rem;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.8rem;
      font-weight: 500;
    }
    .entrance h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3rem, 9vw, 6.2rem);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.02em;
      max-width: 900px;
    }
    .entrance h1 span {
      display: block;
      color: var(--gold);
      font-style: italic;
      font-weight: 400;
    }
    .entrance-sub {
      margin-top: 1.8rem;
      max-width: 32rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
      font-weight: 300;
    }
    .scroll-cue {
      margin-top: 4.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      color: var(--muted);
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
    .scroll-line {
      width: 1px;
      height: 4.2rem;
      background: linear-gradient(to bottom, rgba(201,166,107,0.7), transparent);
      animation: line-breathe 2.5s ease-in-out infinite;
    }
    @keyframes line-breathe {
      0%, 100% { opacity: 0.3; height: 4.2rem; }
      50% { opacity: 1; height: 5rem; }
    }
    .era {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6rem 1.5rem;
      position: relative;
      text-align: center;
    }
    .era-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .era-content {
      position: relative;
      z-index: 2;
      max-width: 520px;
      width: 100%;
    }
    .era-year {
      font-size: 0.68rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.2rem;
      font-weight: 500;
    }
    .era-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      font-weight: 500;
      line-height: 1.1;
      margin-bottom: 1.4rem;
      letter-spacing: -0.01em;
    }
    .era-desc {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.75;
      font-weight: 300;
      margin-bottom: 2.4rem;
    }
    .gate {
      width: 100%;
      max-width: 380px;
      margin: 0 auto 2.2rem;
      aspect-ratio: 4/5;
      border-radius: 0.6rem;
      position: relative;
      overflow: hidden;
      background: #0c0c10;
      border: 1px solid rgba(201,166,107,0.15);
      box-shadow:
        0 30px 60px -20px rgba(0,0,0,0.7),
        0 0 0 1px rgba(255,255,255,0.03);
    }
    .gate-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity 0.8s ease, transform 1.2s cubic-bezier(0.16,1,0.3,1);
    }
    .gate.unlocked .gate-inner {
      opacity: 0;
      transform: scale(1.08);
      pointer-events: none;
    }
    .gate-symbol {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.2rem;
      color: var(--gold);
      opacity: 0.7;
      margin-bottom: 1rem;
      font-weight: 400;
    }
    .gate-label {
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .gate-reveal {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      opacity: 0;
      transform: scale(0.94);
      transition: opacity 0.9s ease 0.2s, transform 1.1s cubic-bezier(0.16,1,0.3,1) 0.15s;
    }
    .gate.unlocked .gate-reveal {
      opacity: 1;
      transform: scale(1);
    }
    .gate-reveal p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem;
      line-height: 1.55;
      color: var(--text);
      font-weight: 400;
      font-style: italic;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 1rem 2rem;
      border-radius: 999px;
      border: 1px solid rgba(201,166,107,0.35);
      background: linear-gradient(135deg, rgba(201,166,107,0.12), rgba(201,166,107,0.05));
      color: var(--text);
      font-size: 0.88rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
      font-weight: 500;
    }
    .action-btn:hover {
      background: linear-gradient(135deg, rgba(201,166,107,0.22), rgba(201,166,107,0.1));
      border-color: rgba(201,166,107,0.6);
      box-shadow: 0 0 30px rgba(201,166,107,0.2);
      transform: translateY(-2px);
    }
    .action-btn:disabled {
      opacity: 0.35;
      pointer-events: none;
    }
    .era-egypt .era-bg {
      background:
        radial-gradient(ellipse 70% 50% at 50% 30%, rgba(180,120,40,0.13) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 30% 70%, rgba(120,70,20,0.08) 0%, transparent 50%);
    }
    .era-ren .era-bg {
      background:
        radial-gradient(ellipse 60% 50% at 60% 40%, rgba(160,100,80,0.12) 0%, transparent 55%),
        radial-gradient(ellipse 40% 30% at 20% 70%, rgba(100,60,40,0.08) 0%, transparent 50%);
    }
    .era-ind .era-bg {
      background:
        radial-gradient(ellipse 70% 45% at 40% 35%, rgba(90,90,100,0.14) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 70% 70%, rgba(60,60,70,0.1) 0%, transparent 50%);
    }
    .era-fut .era-bg {
      background:
        radial-gradient(ellipse 65% 50% at 50% 40%, rgba(80,120,180,0.12) 0%, transparent 55%),
        radial-gradient(ellipse 45% 35% at 30% 75%, rgba(100,80,160,0.09) 0%, transparent 50%);
    }
    .overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      width: 100%; max-width: 420px;
      background: linear-gradient(165deg, #121218 0%, #0a0a0e 100%);
      border: 1px solid rgba(201,166,107,0.18);
      border-radius: 1.2rem;
      padding: 2.4rem 2rem;
      box-shadow: 0 40px 80px -25px rgba(0,0,0,0.8), 0 0 40px rgba(201,166,107,0.06);
      transform: scale(0.94) translateY(20px);
      transition: transform 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    .overlay.open .modal { transform: scale(1) translateY(0); }
    .modal-label {
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.7rem;
    }
    .modal h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.55rem;
      font-weight: 500;
      line-height: 1.35;
      margin-bottom: 1.8rem;
    }
    .option {
      width: 100%;
      text-align: left;
      padding: 1.05rem 1.2rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.02);
      color: var(--text);
      font-size: 0.95rem;
      cursor: pointer;
      margin-bottom: 0.55rem;
      transition: all 0.25s;
    }
    .option:hover {
      border-color: rgba(201,166,107,0.4);
      background: rgba(201,166,107,0.08);
    }
    .option.correct {
      border-color: rgba(120,180,120,0.5);
      background: rgba(120,180,120,0.1);
    }
    .option.wrong {
      border-color: rgba(200,100,100,0.5);
      background: rgba(200,100,100,0.08);
    }
    .feedback {
      margin-top: 1.2rem;
      font-size: 0.88rem;
    }
    .feedback.ok { color: #8fbf8f; }
    .feedback.bad { color: #d09090; }
    .close-btn {
      margin-top: 1.6rem;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
    }
    .close-btn:hover { color: var(--text); }
    .final {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem;
      position: relative;
    }
    .final h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 500;
      margin-bottom: 1.2rem;
    }
    .final p {
      color: var(--muted);
      max-width: 28rem;
      font-size: 1.05rem;
      line-height: 1.7;
      font-weight: 300;
    }
    .dust {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 15% 25%, rgba(255,255,255,0.12) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 70%, rgba(255,255,255,0.08) 0%, transparent 100%),
        radial-gradient(1.2px 1.2px at 75% 20%, rgba(255,255,255,0.1) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 85%, rgba(255,255,255,0.07) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 55%, rgba(255,255,255,0.09) 0%, transparent 100%);
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="dust"></div>
  <div class="progress"><div class="progress-fill" id="progress"></div></div>
  <nav class="era-nav" id="era-nav"></nav>

  <section class="entrance" id="entrance">
    <div class="entrance-glow"></div>
    <p class="entrance-label">A passage through time</p>
    <h1>Time Capsule<br /><span>Tunnel</span></h1>
    <p class="entrance-sub">
      Step into the dark. Each sealed door holds an era.<br />
      Answer correctly to open the next chamber.
    </p>
    <div class="scroll-cue">
      <span>Enter the tunnel</span>
      <div class="scroll-line"></div>
    </div>
  </section>

  <div class="tunnel" id="tunnel"></div>

  <section class="final">
    <h2>The tunnel continues</h2>
    <p>You have walked through four ages of human civilization. The next door is still unbuilt.</p>
  </section>

  <div class="overlay" id="overlay">
    <div class="modal">
      <p class="modal-label" id="q-label">Chamber 1 of 4</p>
      <h3 id="q-text">Question</h3>
      <div id="q-options"></div>
      <p class="feedback" id="q-feedback"></p>
      <button class="close-btn" id="q-close">Close</button>
    </div>
  </div>

  <script>
    const ERAS = [
      {
        id: 'egypt',
        year: '3100 – 30 BCE',
        title: 'Ancient Egypt',
        desc: 'The Nile floods. Stone rises into pyramids. The dead are prepared for eternity. Knowledge is written in hieroglyphs that outlast empires.',
        symbol: '𓂀',
        gateText: 'The first light of civilization. Rivers, gods, and the architecture of forever.',
        question: 'What river was the lifeblood of Ancient Egypt?',
        options: ['Tigris', 'Nile', 'Euphrates', 'Jordan'],
        answer: 1,
        className: 'era-egypt'
      },
      {
        id: 'ren',
        year: '14th – 17th Century',
        title: 'Renaissance',
        desc: 'Perspective is invented. The human body is studied. Art and science begin to speak the same language. Florence becomes the center of the world.',
        symbol: '✧',
        gateText: 'Man becomes the measure of all things. Light returns to the mind.',
        question: 'Which city is most associated with the birth of the Renaissance?',
        options: ['Paris', 'Rome', 'Florence', 'Venice'],
        answer: 2,
        className: 'era-ren'
      },
      {
        id: 'ind',
        year: '1760 – 1840',
        title: 'Industrial Age',
        desc: 'Steam replaces muscle. Cities swell. Time itself is measured by the factory clock. The world accelerates and never slows again.',
        symbol: '⚙',
        gateText: 'Iron, coal, and the first machines that never sleep.',
        question: 'What primary power source drove the early Industrial Revolution?',
        options: ['Electricity', 'Steam', 'Oil', 'Nuclear'],
        answer: 1,
        className: 'era-ind'
      },
      {
        id: 'fut',
        year: 'Present → Beyond',
        title: 'The Horizon',
        desc: 'Information becomes instantaneous. Distance collapses. We begin to write the next chapter before the previous one has finished.',
        symbol: '◎',
        gateText: 'The door that is still being built. You are standing on its threshold.',
        question: 'What is often called the defining resource of the current age?',
        options: ['Oil', 'Gold', 'Data', 'Land'],
        answer: 2,
        className: 'era-fut'
      }
    ];

    let unlocked = [0];
    let activeEra = 0;
    let currentQuiz = null;

    const tunnel = document.getElementById('tunnel');
    const nav = document.getElementById('era-nav');

    ERAS.forEach((era, i) => {
      const dot = document.createElement('button');
      dot.className = 'era-dot' + (i === 0 ? ' active unlocked' : '');
      dot.innerHTML = `<span>${era.title}</span>`;
      dot.onclick = () => document.getElementById('era-' + i).scrollIntoView({ behavior: 'smooth' });
      nav.appendChild(dot);

      const sec = document.createElement('section');
      sec.className = `era ${era.className}`;
      sec.id = 'era-' + i;
      sec.innerHTML = `
        <div class="era-bg"></div>
        <div class="era-content">
          <p class="era-year">${era.year}</p>
          <h2 class="era-title">${era.title}</h2>
          <p class="era-desc">${era.desc}</p>
          <div class="gate" id="gate-${i}">
            <div class="gate-inner">
              <div class="gate-symbol">${era.symbol}</div>
              <div class="gate-label">Sealed Chamber</div>
            </div>
            <div class="gate-reveal">
              <p>${era.gateText}</p>
            </div>
          </div>
          <div class="actions" data-i="${i}"></div>
        </div>
      `;
      tunnel.appendChild(sec);
    });

    function renderActions() {
      document.querySelectorAll('.actions').forEach(el => {
        const i = +el.dataset.i;
        const isUnlocked = unlocked.includes(i);
        const gate = document.getElementById('gate-' + i);

        if (!isUnlocked) {
          el.innerHTML = `<button class="action-btn" disabled>Chamber locked</button>`;
          return;
        }

        if (gate.classList.contains('unlocked') || unlocked.includes(i + 1) || (i === ERAS.length - 1 && unlocked.includes(i))) {
          gate.classList.add('unlocked');
          el.innerHTML = `<button class="action-btn" disabled style="opacity:0.5">Chamber opened</button>`;
        } else {
          el.innerHTML = `<button class="action-btn" onclick="openQuiz(${i})">Open the chamber →</button>`;
        }
      });

      document.querySelectorAll('.era-dot').forEach((d, i) => {
        d.classList.toggle('active', i === activeEra);
        d.classList.toggle('unlocked', unlocked.includes(i));
      });
    }
    renderActions();

    window.addEventListener('scroll', () => {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      document.getElementById('progress').style.width = Math.min(100, (scrollTop / docHeight) * 100) + '%';

      document.querySelectorAll('.era').forEach((sec, i) => {
        const rect = sec.getBoundingClientRect();
        if (rect.top < window.innerHeight * 0.55 && rect.bottom > window.innerHeight * 0.3) {
          activeEra = i;
          document.querySelectorAll('.era-dot').forEach((d, di) => d.classList.toggle('active', di === i));
        }
      });
    });

    const overlay = document.getElementById('overlay');
    window.openQuiz = function(i) {
      currentQuiz = i;
      const era = ERAS[i];
      document.getElementById('q-label').textContent = `Chamber ${i + 1} of ${ERAS.length}`;
      document.getElementById('q-text').textContent = era.question;
      const opts = document.getElementById('q-options');
      opts.innerHTML = '';
      document.getElementById('q-feedback').textContent = '';
      document.getElementById('q-feedback').className = 'feedback';

      era.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.textContent = opt;
        btn.onclick = () => answer(idx);
        opts.appendChild(btn);
      });
      overlay.classList.add('open');
    };

    function answer(idx) {
      const era = ERAS[currentQuiz];
      const btns = document.querySelectorAll('.option');
      btns.forEach(b => b.disabled = true);
      const feedback = document.getElementById('q-feedback');

      if (idx === era.answer) {
        btns[idx].classList.add('correct');
        feedback.textContent = 'The seal breaks. The chamber opens.';
        feedback.className = 'feedback ok';

        document.getElementById('gate-' + currentQuiz).classList.add('unlocked');
        if (!unlocked.includes(currentQuiz + 1) && currentQuiz + 1 < ERAS.length) {
          unlocked.push(currentQuiz + 1);
        }

        setTimeout(() => {
          overlay.classList.remove('open');
          renderActions();
        }, 1500);
      } else {
        btns[idx].classList.add('wrong');
        feedback.textContent = 'The seal holds. Try again.';
        feedback.className = 'feedback bad';
        setTimeout(() => {
          btns.forEach(b => { b.disabled = false; b.classList.remove('wrong'); });
          feedback.textContent = '';
        }, 1200);
      }
    }

    document.getElementById('q-close').onclick = () => overlay.classList.remove('open');
  </script>
</body>
</html>
